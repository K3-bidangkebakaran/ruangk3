<!doctype html>
<html lang="id">
<head>
<script>/* buka lewat https: penyimpanan browser http & https terpisah */if(location.protocol==='http:'&&/(^|\.)ruangk3\.com$/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Upload Foto Dokumentasi</title>
<meta name="theme-color" content="#14201a">
<link rel="icon" href="../pic/icons/icon-192.png">
<style>
:root{
  --bg:#eef0ea; --surface:#fff; --surface-2:#f6f7f2; --ink:#17201b; --muted:#5b665e; --line:#d9ded5;
  --brand:#f6c800; --brand-ink:#1e1a00; --chrome:#14201a; --chrome-ink:#f2f5ee; --chrome-muted:#a9b6ac;
  --ok:#14804a; --ok-soft:#dcf2e5; --bad:#b42318; --bad-soft:#fde2df; --warn:#a85a05; --warn-soft:#fdebcf; --focus:#1d4ed8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d120f; --surface:#161d18; --surface-2:#1c2520; --ink:#eef1ec; --muted:#9aa69d; --line:#2b362e; --chrome:#0a0f0c;
  --ok:#4ade80; --ok-soft:#10301d; --bad:#f87171; --bad-soft:#3b1512; --warn:#fbbf24; --warn-soft:#3a2a08; --focus:#7aa2ff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{min-height:100%;max-width:520px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column}
@media (min-width:560px){#app{border-inline:1px solid var(--line)}}
.bar{background:var(--chrome);color:var(--chrome-ink);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.bar img{width:36px;height:36px;border-radius:9px;flex:none}
.bar b{display:block;font-size:16px;line-height:1.2}
.bar small{display:block;color:var(--chrome-muted);font-size:12px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
h1,h2{margin:0;line-height:1.2}
h2{font-size:20px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:6px}
.card h1{font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:13px;background:var(--brand);color:var(--brand-ink);justify-self:start}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;background:var(--surface)}
.names{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.nm{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-height:56px}
.nm:active{background:var(--surface-2)}
.nm b{font-size:16px}
.nm small{grid-column:1;color:var(--muted);font-size:13px}
.nm .cnt{grid-column:2;grid-row:1/3;font-weight:700;font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:3px 10px;white-space:nowrap}
.nm .cnt.full{background:var(--ok-soft);color:var(--ok)}
.nm[disabled]{opacity:.65;cursor:not-allowed}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px;width:100%;text-align:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.menu{display:grid;gap:10px}
.menu .btn{display:grid;gap:2px;text-align:left;padding:14px 16px;min-height:68px}
.menu .btn small{font-weight:400;color:var(--muted);font-size:13px}
.row{display:grid;gap:10px}
.row.two{grid-template-columns:1fr 1fr}
.note{border-radius:12px;padding:12px 14px;font-size:14.5px}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.okk{background:var(--ok-soft);color:var(--ok)}
.note.big{font-size:15.5px;font-weight:600;border:2px solid var(--warn)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;width:100%}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cam.land{aspect-ratio:3/2}
.pv{display:block;width:100%;height:auto;border-radius:14px;background:#000}
.cam .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.who{display:grid;gap:2px}
.who b{font-size:18px}.who span{color:var(--muted)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.big{font-size:56px;text-align:center;line-height:1}
.center{text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="bar"><img src="../pic/icons/icon-192.png" alt=""><div><b>Upload Foto Dokumentasi</b><small id="barSub">Memuat…</small></div></header>
  <main id="main"><div class="spin" role="status" aria-label="Memuat"></div></main>
</div>
<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const QS = new URLSearchParams(location.search), KID = (QS.get("k") || "").trim();
const ZONA = { WIB: 7, WITA: 8, WIT: 9 };
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"], BLN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const p2 = n => String(n).padStart(2, "0");
const arr = v => Array.isArray(v) ? v : Object.values(v || {});
const lokasi = (t, k) => { t = String(t || "").trim(); k = String(k || "").trim(); return [t, k && !t.toLowerCase().includes(k.toLowerCase()) ? k : ""].filter(Boolean).join(", "); };
const NOTICE = "Upload foto sesuai dengan tanggal kegiatan, tidak perlu mengupload foto dari timestamp atau aplikasi lain.";

/* ---------- akses data (Firebase; bisa digantikan window.__FT_FB untuk uji) ----------
   dh_foto/{kid}            info dari aplikasi PIC: {nama, tgl[], tempat, kota, zona, harian, peserta[{id,nama,instansi,kelas,n,t}]}
   dh_foto_in/{kid}/{kunci} foto (dataURL JPEG), sekali tulis. kunci = h~{tanggal}~{acak} (harian) | p~{idPeserta}~{acak} (peserta)
   dh_foto_st/{kid}/{kunci} penanda waktu server; dibuang aplikasi PIC begitu fotonya diambil */
async function backend() {
  if (window.__FT_FB) return window.__FT_FB;
  const V = "https://www.gstatic.com/firebasejs/11.6.1/", ROOT = "artifacts/k3-kebakaran-app-v5/public/data";
  const [a, au, d] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-database.js")]);
  const app = a.initializeApp({ apiKey: "AIzaSyA2ow2lR4Z3lX7zBcZC5Xg3eWlDm7KNAAg", authDomain: "portal-k3-bidang-kebakaran.firebaseapp.com", databaseURL: "https://portal-k3-bidang-kebakaran-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "portal-k3-bidang-kebakaran", appId: "1:497833559757:web:01c2de15cd5f56dbb18b84" }, "foto");
  const auth = au.getAuth(app), db = d.getDatabase(app), R = p => d.ref(db, `${ROOT}/${p}`);
  const to = (pr, ms, m) => { let t; return Promise.race([pr, new Promise((_, rj) => { t = setTimeout(() => rj(new Error(m || "Koneksi terlalu lambat.")), ms); })]).finally(() => clearTimeout(t)); };
  await to(au.signInAnonymously(auth), 20000, "Tidak bisa terhubung. Cek internet lalu muat ulang halaman.");
  return {
    info: async k => (await to(d.get(R(`dh_foto/${k}`)), 20000)).val(),
    status: async k => (await to(d.get(R(`dh_foto_st/${k}`)), 20000)).val() || {},
    offset: () => to(new Promise(res => d.onValue(d.ref(db, ".info/serverTimeOffset"), s => res(+s.val() || 0), () => res(0), { onlyOnce: true })), 3000).catch(() => 0),
    async put(k, key, url) { await to(d.set(R(`dh_foto_in/${k}/${key}`), url), 90000, "Pengiriman terlalu lambat."); await to(d.set(R(`dh_foto_st/${k}/${key}`), d.serverTimestamp()), 30000); },
  };
}

/* ---------- waktu mengikuti zona kegiatan (jam server, bukan jam HP) ---------- */
let OFF = 0;
const zonaHP = () => { const m = -new Date().getTimezoneOffset(); return m === 420 ? "WIB" : m === 480 ? "WITA" : m === 540 ? "WIT" : ""; };
const nowZ = zona => { const zn = zonaHP() || (ZONA[zona] ? zona : "WIB"), t = new Date(Date.now() + OFF + ZONA[zn] * 3600e3); return { zn, iso: `${t.getUTCFullYear()}-${p2(t.getUTCMonth() + 1)}-${p2(t.getUTCDate())}`, h: t.getUTCHours(), m: t.getUTCMinutes(), s: t.getUTCSeconds() }; };
const tglPanjang = iso => { const [y, m, d] = iso.split("-").map(Number), w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return `${HARI[w]}, ${d} ${BLN[m - 1]} ${y}`; };

/* ---------- state ---------- */
let FB = null, INFO = null, ST = {}, CHOSEN = null, SHOT = null, STREAM = null, busy = false, SCREEN = "", MODE = "", FACING = "environment";
const main = $("#main");
const show = (html, scr) => { SCREEN = scr || ""; main.innerHTML = html; };
const fail = (msg, extra) => { $("#barSub").textContent = ""; show(`<div class="note err">${esc(msg)}</div>${extra || ""}<button class="btn" id="reload">Muat ulang</button>`); const b = $("#reload"); if (b) b.onclick = () => location.reload(); };
const tgls = () => arr(INFO && INFO.tgl).filter(Boolean).slice().sort();
const pes = () => arr(INFO && INFO.peserta).filter(p => p && p.id);
function ctx() { const z = nowZ(INFO.zona), tgl = tgls(), idx = tgl.indexOf(z.iso); return { z, tgl, idx, awal: tgl.length && z.iso < tgl[0], akhir: tgl.length && z.iso > tgl[tgl.length - 1] }; }

async function boot() {
  if (!KID) return fail("Link tidak lengkap. Minta link upload foto yang benar dari PIC.");
  try { FB = await backend(); } catch (e) { return fail(e.message || "Tidak bisa terhubung."); }
  try { [INFO, OFF] = await Promise.all([FB.info(KID), FB.offset()]); } catch (e) { return fail(/permission/i.test(e.message || "") ? "Halaman ini belum bisa dibuka (akses ditolak). Hubungi PIC." : (e.message || "Gagal memuat data.")); }
  if (!INFO || !INFO.nama) return fail("Link upload foto untuk kegiatan ini belum aktif atau tidak berlaku. Hubungi PIC.");
  $("#barSub").textContent = INFO.nama || "";
  await refreshSt(); menu();
}
async function refreshSt() { try { ST = await FB.status(KID); } catch (_) { /* pakai data terakhir */ } }
async function refreshAll() { try { const i = await FB.info(KID); if (i && i.nama) INFO = i; } catch (_) { } await refreshSt(); }
const onIdle = () => SCREEN === "menu" || SCREEN === "off" || SCREEN === "plist";
setInterval(() => { if (!INFO || !FB || busy || !onIdle() || document.hidden) return; refreshAll().then(() => { if (onIdle() && !busy) { if (SCREEN === "plist") { const q = $("#q"); plist(q ? q.value : ""); } else menu(); } }); }, 30000);

/* ---------- tampilan ---------- */
function head(c) {
  const lk = lokasi(INFO.tempat, INFO.kota);
  return `<div class="card"><h1>${esc(INFO.nama)}</h1><div class="meta"><span>${esc(tglPanjang(c.z.iso))}</span>${lk ? `<span>📍 ${esc(lk)}</span>` : ""}</div>`
    + (c.idx >= 0 ? `<span class="pill">Hari ke-${c.idx + 1} dari ${c.tgl.length}</span>` : "") + `</div>`;
}
const notice = () => `<div class="note warn big" role="note">${esc(NOTICE)}</div>`;
function menu() {
  MODE = ""; CHOSEN = null; SHOT = null;
  const c = ctx();
  if (c.idx < 0) {
    const msg = c.awal ? "Link ini belum bisa dipakai. Kegiatan belum dimulai; upload foto baru dibuka pada tanggal kegiatan." : c.akhir ? "Kegiatan sudah selesai. Link ini sudah tidak bisa dipakai untuk upload foto." : "Hari ini bukan hari kegiatan. Upload foto hanya bisa dilakukan pada tanggal kegiatan.";
    return show(head(c) + notice() + `<div class="note err">${esc(msg)}</div><div class="meta">Jadwal: ${esc(c.tgl.map(tglPanjang).join(" · ") || "-")}</div><button class="btn" id="reload">Periksa lagi</button>`, "off"), ($("#reload").onclick = () => location.reload());
  }
  const harian = !!INFO.harian, jmlP = pes().length;
  show(head(c) + notice() + `<h2>Pilih jenis foto</h2><div class="menu">`
    + (harian ? `<button class="btn" id="mH"><b>📷 Dokumentasi Harian</b><small>Foto kegiatan hari ini (Hari ke-${c.idx + 1}), bukan foto per peserta</small></button>` : "")
    + `<button class="btn" id="mP"><b>🧑‍🤝‍🧑 Dokumentasi Peserta</b><small>Foto tiap peserta · ${jmlP} peserta</small></button></div>`
    + `<p class="center" style="color:var(--muted);font-size:13px;margin:0">Foto diambil langsung dari kamera lewat halaman ini dan otomatis diberi tanggal, jam, dan tempat.</p>`, "menu");
  if (harian) $("#mH").onclick = () => { MODE = "h"; bukaKamera(); };
  $("#mP").onclick = () => plist("");
}
/* ---------- daftar peserta ---------- */
const pend = id => Object.keys(ST || {}).filter(k => k.startsWith(`p~${id}~`)).length;
const terisi = p => Math.min(+p.n || 1, (+p.t || 0) + pend(p.id));
function plist(q) {
  const c = ctx(); if (c.idx < 0) return menu();
  const ps = pes().filter(p => !q || (p.nama + " " + p.instansi + " " + (p.kelas || "")).toLowerCase().includes(q.toLowerCase()));
  show(head(c) + notice() + `<button class="btn" id="back">← Kembali</button><h2>Pilih nama peserta</h2>
    <input class="search" id="q" type="search" placeholder="Cari nama atau perusahaan" aria-label="Cari nama atau perusahaan" autocomplete="off" value="${esc(q || "")}">
    <ul class="names">${ps.map(p => { const t = terisi(p), n = +p.n || 1, full = t >= n; return `<li><button class="nm" data-id="${esc(p.id)}"${full ? " disabled" : ""}><b>${esc(p.nama)}</b><small>${esc(p.instansi || "")}${p.kelas ? " · " + esc(p.kelas) : ""}</small><span class="cnt${full ? " full" : ""}">${full ? "✓ Lengkap" : `${t}/${n} foto`}</span></button></li>`; }).join("") || `<li class="empty">${pes().length ? "Nama tidak ditemukan." : "Belum ada peserta di kegiatan ini."}</li>`}</ul>`, "plist");
  $("#back").onclick = menu;
  const qi = $("#q"); qi.oninput = () => { const v = qi.value, pos = qi.selectionStart; plist(v); const q2 = $("#q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (_) { } };
  main.querySelectorAll(".nm").forEach(b => { b.onclick = () => { CHOSEN = pes().find(p => p.id === b.dataset.id); if (CHOSEN) { MODE = "p"; bukaKamera(); } }; });
}

/* ---------- kamera ---------- */
async function stopCam() { if (STREAM) { STREAM.getTracks().forEach(t => t.stop()); STREAM = null; } }
const judulFoto = () => MODE === "h" ? "Dokumentasi Harian" : "Dokumentasi Peserta";
function whoHtml() {
  if (MODE === "h") return `<div class="who"><b>Dokumentasi Harian</b><span>Hari ke-${ctx().idx + 1} · ${esc(tglPanjang(ctx().z.iso))}</span></div>`;
  const t = terisi(CHOSEN), n = +CHOSEN.n || 1;
  return `<div class="who"><b>${esc(CHOSEN.nama)}</b><span>${esc(CHOSEN.instansi || "")}${CHOSEN.kelas ? " · " + esc(CHOSEN.kelas) : ""}</span><span>Foto ke-${Math.min(t + 1, n)} dari ${n}</span></div>`;
}
async function bukaKamera() {
  const c = ctx(); if (c.idx < 0) return menu();
  SHOT = null;
  show(head(c) + `<div class="note warn">${esc(NOTICE)}</div>${whoHtml()}
    <div class="cam${MODE === "h" ? " land" : ""}" id="cam"><video id="vid" playsinline muted autoplay></video><div class="hint">Arahkan kamera ke objek foto</div></div>
    <div id="camMsg"></div>
    <div class="row two"><button class="btn" id="back">Batal</button><button class="btn pri" id="snap" disabled>📸 Ambil foto</button></div>
    <button class="btn" id="flip" hidden>🔄 Putar kamera depan / belakang</button>
    <label class="btn" id="fbWrap" hidden style="display:none">Buka kamera bawaan HP<input id="fbFile" type="file" accept="image/*" capture="environment" hidden></label>`, "cam");
  $("#back").onclick = async () => { await stopCam(); MODE === "h" ? menu() : plist(""); };
  const useFile = why => { $("#camMsg").innerHTML = `<div class="note warn">${esc(why)}</div>`; const w = $("#fbWrap"); w.hidden = false; w.style.display = "block"; $("#cam").style.display = "none"; $("#snap").style.display = "none"; $("#flip").hidden = true; };
  $("#fbFile").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const z = nowZ(INFO.zona);
    if (f.lastModified > 0) { const t = new Date(f.lastModified + ZONA[z.zn] * 3600e3), iso = `${t.getUTCFullYear()}-${p2(t.getUTCMonth() + 1)}-${p2(t.getUTCDate())}`; if (iso !== z.iso) { $("#camMsg").innerHTML = `<div class="note err">Foto ini bukan foto hari ini. Upload hanya foto yang diambil pada tanggal kegiatan (${esc(tglPanjang(z.iso))}). Ambil foto baru dengan kamera.</div>`; e.target.value = ""; return; } }
    try { const img = await new Promise((res, rej) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); await ambil(img, img.naturalWidth, img.naturalHeight); }
    catch (_) { useFile("Foto tidak bisa dibaca. Ambil foto lagi."); }
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return useFile("Kamera langsung tidak tersedia di browser ini. Gunakan kamera bawaan HP.");
  try {
    STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: FACING }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = $("#vid"); v.srcObject = STREAM; await v.play().catch(() => { });
    $("#snap").disabled = false; $("#flip").hidden = false;
    $("#flip").onclick = async () => { FACING = FACING === "environment" ? "user" : "environment"; await stopCam(); bukaKamera(); };
    $("#snap").onclick = async () => { const v2 = $("#vid"); if (!v2.videoWidth) { $("#camMsg").innerHTML = `<div class="note warn">Kamera belum siap, tunggu sebentar.</div>`; return; } await ambil(v2, v2.videoWidth, v2.videoHeight); };
  } catch (e) { useFile(/denied|permission|notallowed/i.test(String(e && (e.name + e.message))) ? "Izin kamera ditolak. Izinkan kamera di pengaturan browser, atau gunakan kamera bawaan HP." : "Kamera tidak bisa dibuka. Gunakan kamera bawaan HP."); }
}

/* ---------- ambil gambar + watermark (tanggal & jam dari jam server) ---------- */
function stamp(x, w, h, lines) {
  const f = Math.max(14, Math.round(w / 40)), pad = Math.round(f * .55), gap = Math.round(f * .25), maxW = w - pad * 2, rows = [];
  lines.forEach((t, i) => {
    const fs = i === 0 ? Math.round(f * 1.25) : f; x.font = (i === 0 ? "700 " : "") + fs + "px Arial, sans-serif";
    let cur = ""; String(t).split(" ").forEach(wd => { const tr = cur ? cur + " " + wd : wd; if (cur && x.measureText(tr).width > maxW) { rows.push([cur, fs, i === 0]); cur = wd; } else cur = tr; });
    if (cur) rows.push([cur, fs, i === 0]);
  });
  const bh = pad * 2 + rows.reduce((a, r) => a + r[1] + gap, 0) - gap;
  x.fillStyle = "rgba(0,0,0,.6)"; x.fillRect(0, h - bh, w, bh); x.fillStyle = "#fff"; x.textBaseline = "top";
  let y = h - bh + pad; rows.forEach(([t, fs, b]) => { x.font = (b ? "700 " : "") + fs + "px Arial, sans-serif"; x.fillText(t, pad, y, maxW); y += fs + gap; });
}
async function ambil(src, sw, sh) {
  const z = nowZ(INFO.zona), lk = lokasi(INFO.tempat, INFO.kota);
  const ratio = MODE === "h" ? 1.5 : (sw > sh ? 16 / 9 : 0); // harian: 3:2 (sama seperti kamera PIC); peserta: utuh, landscape dipotong 16:9
  let cx = 0, cy = 0, cw = sw, ch = sh;
  if (ratio) { if (sw / sh > ratio) { cw = sh * ratio; cx = (sw - cw) / 2; } else { ch = sw / ratio; cy = (sh - ch) / 2; } }
  const s = Math.min(1, 1280 / Math.max(cw, ch)), w = Math.round(cw * s), h = Math.round(ch * s);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d");
  g.drawImage(src, cx, cy, cw, ch, 0, 0, w, h);
  const lines = [MODE === "p" ? CHOSEN.nama : "", INFO.nama, lk ? `Tempat: ${lk}` : "", `${tglPanjang(z.iso)} · ${p2(z.h)}.${p2(z.m)}.${p2(z.s)} ${z.zn}`].filter(Boolean);
  stamp(g, w, h, lines);
  await stopCam();
  SHOT = { url: cv.toDataURL("image/jpeg", 0.72), iso: z.iso, mode: MODE, pid: MODE === "p" ? CHOSEN.id : "" };
  preview();
}
function preview() {
  const c = ctx();
  show(head(c) + whoHtml() + `<img class="pv" src="${SHOT.url}" alt="Hasil foto"><div id="sendMsg"></div>
    <div class="row two"><button class="btn" id="again">Ulangi foto</button><button class="btn pri" id="send">✓ Kirim foto</button></div>`, "prev");
  $("#again").onclick = bukaKamera; $("#send").onclick = kirim;
}

/* ---------- kirim ---------- */
const acak = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
async function kirim() {
  if (busy) return; busy = true;
  const b = $("#send"), a = $("#again"), msg = $("#sendMsg"); b.disabled = a.disabled = true; b.textContent = "Mengirim…"; msg.innerHTML = "";
  try {
    const c = ctx(); if (c.idx < 0 || c.z.iso !== SHOT.iso) throw Object.assign(new Error("Hari kegiatan sudah berganti. Foto ini tidak bisa dikirim."), { stop: true });
    if (SHOT.mode === "p") { // jangan melebihi jumlah foto peserta: cek ulang ke server
      await refreshAll(); const p = pes().find(x => x.id === SHOT.pid);
      if (!p) throw Object.assign(new Error("Nama peserta tidak ditemukan lagi (mungkin dibatalkan PIC)."), { stop: true });
      if (terisi(p) >= (+p.n || 1)) throw Object.assign(new Error(`Foto ${p.nama} sudah lengkap (${p.n} foto).`), { stop: true });
    }
    const key = SHOT.mode === "h" ? `h~${SHOT.iso}~${acak()}` : `p~${SHOT.pid}~${acak()}`;
    await FB.put(KID, key, SHOT.url); ST[key] = Date.now();
    selesai();
  } catch (e) {
    msg.innerHTML = `<div class="note err">${e && e.stop ? esc(e.message) : "Gagal mengirim: " + esc((e && e.message) || "cek internet") + ". Foto Anda masih tersimpan, tekan Kirim lagi."}</div>`;
    b.disabled = a.disabled = false; b.textContent = "✓ Kirim lagi";
    if (e && e.stop) { b.onclick = () => (MODE === "h" ? menu() : plist("")); b.textContent = "Kembali"; a.hidden = true; }
  } finally { busy = false; }
}
function selesai() {
  const h = SHOT.mode === "h", p = h ? null : pes().find(x => x.id === SHOT.pid), sisa = p ? (+p.n || 1) - terisi(p) : 0;
  show(`<div class="big">✅</div><h2 class="center">Foto terkirim</h2>
    <div class="who center">${h ? `<b>Dokumentasi Harian</b><span>${esc(tglPanjang(SHOT.iso))}</span>` : `<b>${esc(p.nama)}</b><span>${esc(p.instansi || "")}</span><span>${sisa > 0 ? `Masih bisa ${sisa} foto lagi` : "Foto peserta ini sudah lengkap"}</span>`}</div>
    <img class="pv" src="${SHOT.url}" alt="Foto terkirim">
    ${h ? `<button class="btn pri" id="nx">📸 Ambil foto lagi</button>` : sisa > 0 ? `<button class="btn pri" id="nx">📸 Foto berikutnya untuk ${esc(p.nama)}</button>` : ""}
    <button class="btn" id="done">${h ? "Selesai" : "Pilih peserta lain"}</button>`, "ok");
  const nx = $("#nx"); if (nx) nx.onclick = bukaKamera;
  $("#done").onclick = () => { SHOT = null; h ? menu() : plist(""); };
}
/* tanggal berganti saat halaman masih terbuka: perbarui tampilan menu */
let LASTISO = ""; setInterval(() => { if (!INFO) return; const z = nowZ(INFO.zona).iso; if (LASTISO && z !== LASTISO && onIdle()) menu(); LASTISO = z; }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && FB && INFO && !busy && onIdle()) refreshAll().then(() => { if (onIdle() && !busy) menu(); }); });
boot();
</script>
</body>
