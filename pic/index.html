<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal PIC</title>
<meta name="theme-color" content="#14201a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface-2:#f6f7f2; --ink:#17201b; --muted:#5b665e; --line:#d9ded5;
  --brand:#f6c800; --brand-ink:#1e1a00;
  --chrome:#14201a; --chrome-ink:#f2f5ee; --chrome-muted:#a9b6ac;
  --ok:#14804a; --ok-soft:#dcf2e5; --warn:#a85a05; --warn-soft:#fdebcf; --bad:#b42318; --bad-soft:#fde2df;
  --focus:#1d4ed8; --paper:#ffffff;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d120f; --surface:#161d18; --surface-2:#1c2520; --ink:#eef1ec; --muted:#9aa69d; --line:#2b362e;
  --chrome:#0a0f0c; --ok:#4ade80; --ok-soft:#10301d; --warn:#fbbf24; --warn-soft:#3a2a08; --bad:#f87171; --bad-soft:#3b1512;
  --focus:#7aa2ff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
small{color:var(--muted)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.appbar{background:var(--chrome);color:var(--chrome-ink);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;flex:none}
.appbar img{width:36px;height:36px;border-radius:9px;flex:none}
.appbar .ttl{min-width:0;flex:1}
.appbar .ttl b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{color:var(--chrome-muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .back{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:var(--chrome-ink);display:grid;place-items:center;flex:none}
.sync{border:0;border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:var(--chrome-ink);flex:none;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.ok .dot{color:#4ade80}.sync.send .dot{color:var(--brand);animation:blink 1s infinite}.sync.off .dot{color:#fb923c}.sync.err .dot{color:#f87171}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sync.send .dot{animation:none}}
.screen>*{flex-shrink:0}
.screen{flex:1;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.hello h2{font-size:22px}
.kcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;width:100%;display:flex;flex-direction:column;gap:10px}
.kcard:active{background:var(--surface-2)}
.kcard h3{font-size:16px;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.full i b{background:var(--ok)}
.bar span{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.tile{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;width:100%}
.tile:active{background:var(--surface-2)}
.tile .ic{width:48px;height:48px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.tile b{display:block;font-family:var(--f-display);font-size:16px}
.tile small{display:block}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:13px}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.err{color:var(--bad);font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;white-space:nowrap;font-size:13px}
.chips button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.counter div{border:1px solid var(--line);border-radius:10px;padding:8px 8px;background:var(--surface-2)}
.counter b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.counter small{font-size:11.5px}
.ahead,.arow{display:grid;grid-template-columns:76px minmax(0,1fr) 112px;gap:8px;align-items:center}
.ahead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 8px}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);min-height:62px}
.arow .who{min-width:0}
.arow .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.arow .who small{font-size:12px}
.cbx{display:grid;place-items:center;min-height:44px;cursor:pointer;position:relative}
.cbx input{position:absolute;opacity:0;width:44px;height:44px;margin:0}
.cbx span{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;background:var(--surface)}
.cbx input:checked + span{background:var(--bad);border-color:var(--bad);color:#fff}
.cbx input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.sigbtn{border:1.5px dashed var(--muted);border-radius:10px;background:transparent;min-height:46px;width:100%;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);padding:2px}
.sigbtn.done{border:1px solid var(--ok);background:var(--paper)}
.sigbtn img{max-height:38px;max-width:100%;display:block}
.stbtn{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:12.5px;padding:0 4px;cursor:pointer}
.stbtn.rm{background:#fff200;border-color:#ca8a04;color:#1d1d1f}
.stbtn.cx{background:#ff6b6b;border-color:#dc2626;color:#1d1d1f}
.stbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* warna stabilo sama seperti di daftar hadir: Remedial kuning, Cancel merah */
.arow.rm{background:#fff7a8;border-color:#eab308;color:#1d1d1f}
.arow.cx{background:#ffb3b3;border-color:#ff6b6b;color:#1d1d1f}
.arow.rm .who small,.arow.cx .who small{color:#3b3b3b}
.arow.cx .sigbtn{visibility:hidden}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ph .img{aspect-ratio:3/2;background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--line) 10px 20px);display:grid;place-items:center;color:var(--muted);font-size:12px}
.ph .img img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.ph .cap b{font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.ph.cx{opacity:.55}
.ph.rm{background:#fff7a8;border-color:#e6c200}
.ph .slots{display:grid;grid-template-columns:1fr;gap:6px;padding:6px}
.ph .slot{display:flex;flex-direction:column;gap:6px}
.ph .slot .img{border-radius:8px;overflow:hidden}
.ph .cap small{color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.photos.dk{grid-template-columns:1fr}
.photos.dk .slots{grid-template-columns:1fr 1fr}
.ph .pill.warn{background:#fff200;color:#000}
.filebtn{position:relative;overflow:hidden;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.camtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(0,0,0,.7)}
.camtop .btn{background:#222;color:#fff;border-color:#444}
.camsel{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;flex:1;font-size:12px;line-height:1.25}
.camsel b{font-size:15px;overflow-wrap:anywhere}
.camsel span.ok{color:#7ee2a8}.camsel span.bad{color:#ffb4a8}
.camstage{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center}
.camstage video,.camstage>img{width:100%;height:100%;object-fit:contain;display:block}
.camstage video.mirror{transform:scaleX(-1)}
.camstage [hidden]{display:none!important}
.camwm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);padding:8px 12px;font-size:12px;line-height:1.35;display:flex;flex-direction:column;pointer-events:none}
.camwm b{font-size:15px}
.camfb{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.camfb .btn{background:#222;color:#fff;border-color:#555}.camfb .btn.pri{background:var(--brand,#f6c800);color:#1e1a00;border-color:transparent}
.cambar{display:flex;align-items:center;justify-content:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.7);min-height:96px}
.cambar [hidden]{display:none!important}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.shutter:disabled{opacity:.35}
.overlay{position:absolute;inset:0;background:rgba(10,15,12,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.pad{border:2px dashed var(--muted);border-radius:12px;background:var(--paper);touch-action:none;width:100%;display:block;aspect-ratio:600/240}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{justify-content:center}
.login .logo{width:84px;height:84px;border-radius:22px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
