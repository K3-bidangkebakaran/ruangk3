<!doctype html>
<html lang="id">
<head>
<script>/* buka lewat https: penyimpanan browser http & https terpisah (koneksi Drive tidak terbaca di http) */if(location.protocol==='http:'&&/(^|\.)ruangk3\.com$/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tanda Tangan Peserta</title>
<meta name="theme-color" content="#14201a">
<link rel="icon" href="../pic/icons/icon-192.png">
<style>
:root{
  --bg:#eef0ea; --surface:#fff; --surface-2:#f6f7f2; --ink:#17201b; --muted:#5b665e; --line:#d9ded5;
  --brand:#f6c800; --brand-ink:#1e1a00; --chrome:#14201a; --chrome-ink:#f2f5ee; --chrome-muted:#a9b6ac;
  --ok:#14804a; --ok-soft:#dcf2e5; --bad:#b42318; --bad-soft:#fde2df; --warn:#a85a05; --warn-soft:#fdebcf; --focus:#1d4ed8;
  --padbg:#fcfcf8; --padink:#14233a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d120f; --surface:#161d18; --surface-2:#1c2520; --ink:#eef1ec; --muted:#9aa69d; --line:#2b362e; --chrome:#0a0f0c;
  --ok:#4ade80; --ok-soft:#10301d; --bad:#f87171; --bad-soft:#3b1512; --warn:#fbbf24; --warn-soft:#3a2a08; --focus:#7aa2ff; --padbg:#f4f4ee; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{min-height:100%;max-width:520px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column}
@media (min-width:560px){#app{border-inline:1px solid var(--line)}}
.bar{background:var(--chrome);color:var(--chrome-ink);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.bar img{width:36px;height:36px;border-radius:9px;flex:none}
.bar b{display:block;font-size:16px;line-height:1.2}
.bar small{display:block;color:var(--chrome-muted);font-size:12px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
h2{margin:0;font-size:20px;line-height:1.25}
.hello{display:grid;gap:8px;font-size:17px;line-height:1.55}
.hello p{margin:0}
.hello .nm{font-size:20px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.card{border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--surface-2);display:grid}
.kv{display:grid;grid-template-columns:96px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;overflow-wrap:anywhere}
.padwrap{display:grid;gap:6px}
.padwrap label{font-weight:700}
.pad{width:100%;aspect-ratio:5/2;border:2px dashed var(--line);border-radius:14px;background:var(--padbg);touch-action:none;display:block;cursor:crosshair}
.pad.ink{border-style:solid;border-color:var(--padink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px;width:100%}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:grid;gap:10px}
.row.two{grid-template-columns:1fr 1fr}
.note{border-radius:12px;padding:12px 14px;font-size:14.5px}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.okk{background:var(--ok-soft);color:var(--ok)}
.hint{color:var(--muted);font-size:13.5px}
.sigshow{border:1px solid var(--line);border-radius:14px;background:var(--padbg);padding:8px;display:grid;place-items:center}
.sigshow img{max-width:100%;max-height:150px;display:block}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.big{font-size:56px;text-align:center;line-height:1}
.center{text-align:center}
[hidden]{display:none!important}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:13px;background:var(--brand);color:var(--brand-ink);justify-self:start}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;background:var(--surface)}
.names{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.nmb{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-height:56px}
.nmb:active{background:var(--surface-2)}
.nmb b{font-size:16px}
.nmb small{grid-column:1;color:var(--muted);font-size:13px}
.nmb .ok{grid-column:2;grid-row:1/3;color:var(--ok);font-weight:700;font-size:13px;background:var(--ok-soft);border-radius:99px;padding:3px 10px}
.nmb[disabled]{opacity:.65;cursor:not-allowed}
.who{display:grid;gap:2px}
.who b{font-size:18px}.who span{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.pill.dar{background:var(--bad-soft);color:var(--bad);align-self:flex-start;justify-self:start}
.nmb .dl{grid-column:1/3;display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--muted);font-size:12.5px;margin-top:3px}.nmb .dl span{background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 9px;font-weight:700}
.btn.dar{color:var(--bad);border-color:var(--bad)}
.dlist{display:flex;flex-wrap:wrap;gap:6px}
.dlist span{background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
h2{margin:0;font-size:20px;line-height:1.2}
</style>
</head>
<body>
<div id="app">
  <header class="bar"><img src="../pic/icons/icon-192.png" alt=""><div><b>Tanda Tangan Peserta</b><small id="barSub">Memuat…</small></div></header>
  <main id="main"><div class="spin" role="status" aria-label="Memuat"></div></main>
</div>
<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const QS = new URLSearchParams(location.search), KID = (QS.get("k") || "").trim(), KL = (QS.get("kl") || "_").trim() || "_";
const ZONA = { WIB: 7, WITA: 8, WIT: 9 };
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"], BLN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const p2 = n => String(n).padStart(2, "0");
const lokasi = (t, k) => { t = String(t || "").trim(); k = String(k || "").trim(); return [t, k && !t.toLowerCase().includes(k.toLowerCase()) ? k : ""].filter(Boolean).join(", "); };

/* ---------- akses data (Firebase; bisa digantikan window.__TP_FB untuk uji) ---------- */
async function backend() {
  if (window.__TP_FB) return window.__TP_FB;
  const V = "https://www.gstatic.com/firebasejs/11.6.1/", ROOT = "artifacts/k3-kebakaran-app-v5/public/data";
  const [a, au, d] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-database.js")]);
  const app = a.initializeApp({ apiKey: "AIzaSyA2ow2lR4Z3lX7zBcZC5Xg3eWlDm7KNAAg", authDomain: "portal-k3-bidang-kebakaran.firebaseapp.com", databaseURL: "https://portal-k3-bidang-kebakaran-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "portal-k3-bidang-kebakaran" });
  const auth = au.getAuth(app), db = d.getDatabase(app), R = p => d.ref(db, `${ROOT}/${p}`);
  const to = (pr, ms, m) => { let t; return Promise.race([pr, new Promise((_, rj) => { t = setTimeout(() => rj(new Error(m || "Koneksi terlalu lambat.")), ms); })]).finally(() => clearTimeout(t)); };
  await to(au.signInAnonymously(auth), 20000, "Tidak bisa terhubung. Cek internet lalu muat ulang halaman.");
  return {
    info: async (k, kl) => (await to(d.get(R(`dh_ttdp/${k}/${kl}`)), 20000)).val(),
    status: async (k, kl) => (await to(d.get(R(`dh_ttdp_st/${k}/${kl}`)), 20000)).val() || {},
    has: async (k, kl, key) => (await to(d.get(R(`dh_ttdp_st/${k}/${kl}/${key}`)), 15000)).val() != null,
    offset: () => to(new Promise(res => d.onValue(d.ref(db, ".info/serverTimeOffset"), s => res(+s.val() || 0), () => res(0), { onlyOnce: true })), 3000).catch(() => 0),
    async put(k, kl, key, url) { await to(d.set(R(`dh_ttdp_ttd/${k}/${kl}/${key}`), url), 60000, "Pengiriman terlalu lambat."); await to(d.set(R(`dh_ttdp_st/${k}/${kl}/${key}`), d.serverTimestamp()), 30000); },
  };
}

/* ---------- waktu: jam server + zona waktu HP (WIB/WITA/WIT), selain itu zona kegiatan ---------- */
let OFF = 0;
const zonaHP = () => { const m = -new Date().getTimezoneOffset(); return m === 420 ? "WIB" : m === 480 ? "WITA" : m === 540 ? "WIT" : ""; };
const nowZ = zona => { const zn = zonaHP() || (ZONA[zona] ? zona : "WIB"), t = new Date(Date.now() + OFF + ZONA[zn] * 3600e3); return { zn, iso: `${t.getUTCFullYear()}-${p2(t.getUTCMonth() + 1)}-${p2(t.getUTCDate())}` }; };
const tglPanjang = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); if (!m) return ""; const y = +m[1], mo = +m[2], d = +m[3], w = new Date(Date.UTC(y, mo - 1, d)).getUTCDay(); return `${HARI[w]}, ${d} ${BLN[mo - 1]} ${y}`; };

/* ---------- state ---------- */
let FB = null, INFO = null, ST = {}, CHOSEN = null, busy = false, INK = false, SCREEN = "", LASTDAY = "", DR = QS.get("darurat") === "1";
const main = $("#main");
const show = (html, scr) => { SCREEN = scr || ""; main.innerHTML = html; };
const fail = (msg) => { $("#barSub").textContent = ""; show(`<div class="note err">${esc(msg)}</div><button class="btn" id="reload">Muat ulang</button>`); $("#reload").onclick = () => location.reload(); };
const tglList = () => { const t = INFO && INFO.tgl; return Array.isArray(t) ? t : Object.values(t || {}); };
const pesList = () => { const p = INFO && INFO.peserta; return (Array.isArray(p) ? p : Object.values(p || {})).filter(x => x && x.id && x.nama); };
const hrOf = p => (Array.isArray(p.hr) ? p.hr : Object.values(p.hr || {}));

async function boot() {
  if (!KID) return fail("Link tidak lengkap. Minta link tanda tangan yang benar dari PIC.");
  try { FB = await backend(); } catch (e) { return fail(e.message || "Tidak bisa terhubung."); }
  try { [INFO, OFF] = await Promise.all([FB.info(KID, KL), FB.offset()]); }
  catch (e) { return fail(/permission/i.test(e.message || "") ? "Halaman ini belum bisa dibuka (akses ditolak). Hubungi PIC." : (e.message || "Gagal memuat data.")); }
  if (!INFO || !INFO.kegiatan) return fail("Link tanda tangan ini belum aktif atau sudah tidak berlaku. Hubungi PIC.");
  $("#barSub").textContent = INFO.kegiatan || "";
  await refreshSt(); list();
}
async function refreshSt() { try { ST = await FB.status(KID, KL); } catch (_) { /* pakai data terakhir */ } }

/* ---------- daftar nama ---------- */
function ctx() { const z = nowZ(INFO.zona), tgl = tglList(); return { z, tgl, idx: tgl.indexOf(z.iso), over: tgl.length > 0 && z.iso > tgl.slice().sort().pop() }; }
/* ---------- mode darurat: hanya setelah kegiatan selesai; satu tanda tangan dicatat untuk semua hari yang belum diisi ---------- */
const DRon = () => DR && ctx().over;
const tglPendek = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? `${+m[3]} ${BLN[+m[2] - 1].slice(0, 3)}` : iso; };
const miss = p => { const t = tglList(); return [...new Set(hrOf(p).filter(d => t.includes(d) && !ST[`${p.id}~${d}`]))].sort(); };
function head(c) {
  const lk = lokasi(INFO.tempat, INFO.kota);
  return `<div class="card" style="gap:6px;padding:14px"><div style="font-size:18px;font-weight:800;line-height:1.25">${esc(INFO.kegiatan)}</div>${INFO.kelas ? `<div class="meta"><b>${esc(INFO.kelas)}</b></div>` : ""}<div class="meta"><span>${esc(tglPanjang(c.z.iso))}</span>${lk ? `<span>📍 ${esc(lk)}</span>` : ""}</div>`
    + (c.idx >= 0 ? `<span class="pill">Hari ke-${c.idx + 1} · Tanda tangan hari ini</span>` : "") + `</div>`;
}
function dlist(q, c) {
  const all = pesList().filter(p => hrOf(p).some(d => c.tgl.includes(d))), need = all.filter(p => miss(p).length);
  const ps = need.filter(p => !q || (p.nama + " " + (p.instansi || "")).toLowerCase().includes(q.toLowerCase()));
  show(head(c) + `<span class="pill dar">🚨 Mode darurat</span>
    <div class="note warn">Khusus peserta yang <b>belum tanda tangan</b> saat kegiatan berlangsung. Pilih nama Anda, tanda tangan sekali, dan tanda tangan itu otomatis dicatat untuk <b>semua hari yang belum Anda isi</b>.</div>
    <div class="note ${need.length ? "warn" : "okk"}" id="prog">${need.length ? `${need.length} peserta masih ada tanggal yang belum tanda tangan.` : "Semua peserta sudah lengkap tanda tangannya."} Nama yang tidak tampil di bawah berarti sudah lengkap.</div>
    <h2>Pilih nama Anda</h2><input class="search" id="q" type="search" placeholder="Cari nama atau perusahaan" aria-label="Cari nama atau perusahaan" autocomplete="off" value="${esc(q || "")}">
    <ul class="names">${ps.map(p => { const m = miss(p); return `<li><button class="nmb" data-id="${esc(p.id)}"><b>${esc(p.nama)}</b><small>${esc(p.instansi || "")}</small><span class="dl">Belum TTD tanggal:${m.map(d => `<span>${esc(tglPendek(d))}</span>`).join("")}</span></button></li>`; }).join("") || `<li class="empty">${need.length ? "Tidak ada nama yang cocok." : "Tidak ada peserta yang perlu tanda tangan darurat."}</li>`}</ul>`, "dlist");
  const qi = $("#q"); qi.oninput = () => { const v = qi.value, pos = qi.selectionStart; list(v); const q2 = $("#q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (_) { } };
  main.querySelectorAll(".nmb").forEach(b => { b.onclick = () => pilih(b.dataset.id); });
}
function list(q) {
  const c = ctx(); LASTDAY = c.z.iso;
  if (DR && c.over) return dlist(q, c);
  if (c.idx < 0) {
    const awal = c.tgl.length && c.z.iso < c.tgl[0], akhir = c.tgl.length && c.z.iso > c.tgl[c.tgl.length - 1];
    show(head(c) + `<div class="note warn">${awal ? "Kegiatan belum dimulai." : akhir ? "Kegiatan sudah selesai." : "Hari ini bukan hari kegiatan."} Tanda tangan hanya bisa dilakukan pada hari kegiatan.</div>`
      + `<div class="meta">Jadwal: ${esc(c.tgl.map(tglPanjang).join(" · "))}</div><button class="btn" id="reload">Periksa lagi</button>`
      + (akhir ? `<div class="note warn">Belum sempat tanda tangan? Tekan tombol darurat di bawah. Tanda tangan Anda akan dicatat untuk hari kegiatan yang belum Anda isi.</div><button class="btn dar" id="dar">🚨 Darurat: saya belum tanda tangan</button>` : ""), "off");
    $("#reload").onclick = () => location.reload(); const db = $("#dar"); if (db) db.onclick = () => { DR = true; list(); }; return;
  }
  const all = pesList().filter(p => hrOf(p).includes(c.z.iso)), done = id => !!ST[`${id}~${c.z.iso}`];
  const ps = all.filter(p => !q || (p.nama + " " + (p.instansi || "")).toLowerCase().includes(q.toLowerCase()));
  const n = all.filter(p => done(p.id)).length;
  show(head(c) + `<div class="note okk" id="prog">${n} dari ${all.length} peserta sudah tanda tangan hari ini.</div>
    <h2>Pilih nama Anda</h2><input class="search" id="q" type="search" placeholder="Cari nama atau perusahaan" aria-label="Cari nama atau perusahaan" autocomplete="off" value="${esc(q || "")}">
    <ul class="names">${ps.map(p => `<li><button class="nmb" data-id="${esc(p.id)}"${done(p.id) ? " disabled" : ""}><b>${esc(p.nama)}</b><small>${esc(p.instansi || "")}</small>${done(p.id) ? `<span class="ok">✓ Sudah TTD</span>` : ""}</button></li>`).join("") || `<li class="empty">${all.length ? "Tidak ada nama yang cocok." : "Belum ada nama peserta untuk hari ini."}</li>`}</ul>`, "list");
  const qi = $("#q"); qi.oninput = () => { const v = qi.value, pos = qi.selectionStart; list(v); const q2 = $("#q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (_) { } };
  main.querySelectorAll(".nmb").forEach(b => { b.onclick = () => pilih(b.dataset.id); });
}

/* ---------- pilih nama -> langsung kotak tanda tangan ---------- */
function pilih(id) { CHOSEN = pesList().find(p => p.id === id); if (CHOSEN) pad(); }
function pad() {
  INK = false; const c0 = ctx(), dr = DRon(), M = dr ? miss(CHOSEN) : [];
  show(head(c0) + `<div class="who"><span>Anda memilih:</span><b>${esc(CHOSEN.nama)}</b><span>${esc(CHOSEN.instansi || "")}</span></div>
    <div class="padwrap"><label for="pad">Tanda tangan di kotak ini</label><canvas class="pad" id="pad" aria-label="Kotak tanda tangan"></canvas><div class="hint">Gunakan jari atau pena layar. Bukan nama Anda? Tekan <b>Kembali</b>. ${dr ? "Tanda tangan hanya bisa dikirim <b>satu kali</b>." : "Tanda tangan hanya bisa dikirim <b>satu kali</b> per hari."}</div></div>
    ${dr ? `<div class="note warn">🚨 Mode darurat. Tanda tangan ini akan dicatat untuk <b>${M.length} hari</b> yang belum Anda isi:<div class="dlist" style="margin-top:6px">${M.map(d => `<span>${esc(tglPendek(d))}</span>`).join("")}</div></div>` : ""}
    <div id="sendMsg"></div>
    <div class="row two"><button class="btn" id="back" type="button">Kembali</button><button class="btn" id="clr" type="button">Hapus</button></div>
    <button class="btn pri" id="send" type="button" disabled>✓ Kirim tanda tangan</button>`, "pad");
  const c = $("#pad"); c.width = 600; c.height = 240;
  const x = c.getContext("2d"); x.strokeStyle = "#14233a"; x.lineWidth = 5; x.lineCap = "round"; x.lineJoin = "round";
  let down = false, lx = 0, ly = 0;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * 600 / r.width, (e.clientY - r.top) * 240 / r.height]; };
  const mark = () => { INK = true; c.classList.add("ink"); $("#send").disabled = false; };
  c.addEventListener("pointerdown", e => { e.preventDefault(); down = true; try { c.setPointerCapture(e.pointerId); } catch (_) { } [lx, ly] = pos(e); x.beginPath(); x.arc(lx, ly, 2.4, 0, 7); x.fillStyle = "#14233a"; x.fill(); mark(); });
  c.addEventListener("pointermove", e => { if (!down) return; e.preventDefault(); const [nx, ny] = pos(e); x.beginPath(); x.moveTo(lx, ly); x.lineTo(nx, ny); x.stroke(); lx = nx; ly = ny; });
  const up = () => { down = false; }; c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  $("#clr").onclick = () => { x.clearRect(0, 0, 600, 240); INK = false; c.classList.remove("ink"); $("#send").disabled = true; $("#sendMsg").innerHTML = ""; };
  $("#back").onclick = () => { CHOSEN = null; refreshSt().then(() => list()); };
  $("#send").onclick = () => kirim(c);
}
async function kirim(c) {
  if (busy || !INK || !CHOSEN) return; busy = true;
  const b = $("#send"), cl = $("#clr"), bk = $("#back"), msg = $("#sendMsg"); b.disabled = cl.disabled = bk.disabled = true; b.textContent = "Mengirim…"; msg.innerHTML = "";
  const url = c.toDataURL("image/png"), z = nowZ(INFO.zona), iso = z.iso, key = `${CHOSEN.id}~${iso}`, dr = DRon();
  try {
    if (dr) {
      const days = [];
      for (const d of miss(CHOSEN)) { const k2 = `${CHOSEN.id}~${d}`; if (await FB.has(KID, KL, k2)) ST[k2] = ST[k2] || 1; else days.push(d); }
      if (!days.length) throw Object.assign(new Error("dup"), { dup: true });
      let n = 0; for (const d of days) { b.textContent = `Mengirim… (${++n}/${days.length})`; const k2 = `${CHOSEN.id}~${d}`; await FB.put(KID, KL, k2, url); ST[k2] = Date.now(); }
      return selesai(url, days);
    }
    if (!tglList().includes(iso) || !hrOf(CHOSEN).includes(iso)) throw Object.assign(new Error("Hari ini bukan jadwal tanda tangan untuk nama ini."), { hari: true });
    if (ST[key] || await FB.has(KID, KL, key)) throw Object.assign(new Error("dup"), { dup: true });
    await FB.put(KID, KL, key, url);
    ST[key] = Date.now(); selesai(url);
  } catch (e) {
    if (e && e.dup) { ST[key] = ST[key] || 1; msg.innerHTML = `<div class="note err">${dr ? "Semua hari Anda sudah tercatat tanda tangan." : "Nama ini sudah tercatat tanda tangan hari ini."} Jika tanda tangan sebelumnya salah, minta PIC menggantinya di aplikasi PIC.</div>`; b.textContent = "Kembali ke daftar"; b.disabled = false; b.onclick = () => { CHOSEN = null; list(); }; cl.hidden = bk.hidden = true; }
    else { msg.innerHTML = `<div class="note err">Gagal mengirim: ${esc((e && e.message) || "cek internet")}.${e && e.hari ? "" : " Tanda tangan Anda masih ada di kotak, tekan Kirim lagi."}</div>`; b.disabled = cl.disabled = bk.disabled = false; b.textContent = "✓ Kirim lagi"; }
  } finally { busy = false; }
}
function selesai(url, days) {
  show(`<div class="big">✅</div><h2 class="center">Tanda tangan berhasil dikirim</h2>${days ? `<div class="note okk center">Dicatat untuk ${days.length} hari: ${esc(days.map(tglPendek).join(" · "))}</div>` : ""}
    <div class="who center"><b>${esc(CHOSEN.nama)}</b><span>${esc(CHOSEN.instansi || "")}</span></div>
    <div class="sigshow"><img src="${url}" alt="Tanda tangan terkirim"></div>
    <button class="btn pri" id="done" type="button">Selesai</button>`, "done");
  $("#done").onclick = () => { CHOSEN = null; list(); };
}
/* Hari berganti saat halaman masih terbuka: perbarui daftar (bila sedang di daftar) */
function tick() { if (!INFO) return; const c = ctx(); if (c.z.iso === LASTDAY) return; LASTDAY = c.z.iso; if (SCREEN === "list" || SCREEN === "off" || SCREEN === "dlist") refreshSt().then(() => { if (SCREEN === "list" || SCREEN === "off" || SCREEN === "dlist") list(($("#q") || {}).value); }); }
setInterval(tick, 10000); window.__tpTick = tick;
document.addEventListener("visibilitychange", () => { if (!document.hidden && !CHOSEN && FB && INFO && (SCREEN === "list" || SCREEN === "dlist")) refreshSt().then(() => { if (!CHOSEN) list(($("#q") || {}).value); }); });
boot();
</script>
